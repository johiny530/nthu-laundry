<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>碩齋洗衣房</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="洗衣房">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#14161a; --muted:#6b7280; --line:#e5e7eb;
    --free:#15803d; --freebg:#dcfce7; --done:#a16207; --donebg:#fef3c7;
    --busy:#1d4ed8; --busybg:#dbeafe; --dead:#6b7280; --deadbg:#f1f3f5;
    --err:#b91c1c; --errbg:#fee2e2; --bell:#c026d3;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa1ab; --line:#272b33;
      --free:#4ade80; --freebg:#14311f; --done:#fbbf24; --donebg:#3a2e0c;
      --busy:#7aa7ff; --busybg:#16233d; --dead:#8b929c; --deadbg:#20242b;
      --err:#fca5a5; --errbg:#3a1717; --bell:#e879f9;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
    padding:16px 14px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin-inline:auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-size:19px;margin:0;letter-spacing:.02em}
  #conn{font-size:12px;color:var(--muted);white-space:nowrap}
  #conn.bad{color:var(--err)}
  #summary{font-size:14px;color:var(--muted);margin:6px 0 20px}
  #summary b{color:var(--free);font-size:28px;font-variant-numeric:tabular-nums;
    vertical-align:-3px;margin-right:3px}
  #summary .sep{margin:0 8px;opacity:.45}
  #summary b.warm{color:var(--done)}
  #keepopen{display:none;font-size:12px;color:var(--bell);margin:-12px 0 6px}
  #keepopen.show{display:block}
  #tools{margin:-8px 0 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  #tools button{font-size:12px;padding:4px 10px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--muted)}
  #tools button:hover{color:var(--text)}
  #testmsg{font-size:12px;color:var(--muted)}
  #testmsg.ok{color:var(--free)} #testmsg.bad{color:var(--err)}
  .head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 8px;gap:10px}
  .head h2{font-size:13px;color:var(--muted);font-weight:600;margin:0;letter-spacing:.08em}
  .head .soon{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .head .soon.ok{color:var(--free);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
  .m{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;display:flex;flex-direction:column;gap:5px;position:relative}
  .m .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .m .n{font-size:13px;color:var(--muted);font-weight:600}
  .m .s{font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
  .m .s::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
  .m .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:18px}
  .bell{background:none;border:0;padding:2px;margin:-2px;cursor:pointer;color:var(--muted);
    opacity:.45;display:flex;line-height:0;border-radius:6px}
  .bell:hover{opacity:1}
  .bell.on{opacity:1;color:var(--bell)}
  .m .lead{position:absolute;right:11px;bottom:10px;font-size:11px;color:var(--bell);font-weight:700}
  .free{background:var(--freebg);border-color:transparent} .free .s{color:var(--free)}
  .done{background:var(--donebg);border-color:transparent} .done .s{color:var(--done)}
  .busy .s{color:var(--busy)}
  .dead{background:var(--deadbg)} .dead .s{color:var(--dead)}
  .err{background:var(--errbg)} .err .s{color:var(--err)}
  /* 提前分鐘的輸入對話框 */
  #ask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:9}
  #ask.show{display:flex}
  #ask .box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:300px;
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  #ask h3{margin:0 0 4px;font-size:16px}
  #ask p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.6}
  #ask input{width:100%;font-size:17px;padding:9px 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);color:var(--text)}
  #ask .btns{display:flex;gap:8px;margin-top:14px}
  #ask button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
  #ask button.go{background:var(--bell);border-color:var(--bell);color:#fff;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>碩齋洗衣房</h1>
  <span id="conn">連線中…</span>
</header>
<p id="summary">—</p>
<p id="keepopen">分頁要留著才會通知，可以最小化或切到背景。</p>
<p id="tools"><button id="test">測試通知</button><span id="testmsg"></span></p>

<div class="head"><h2>洗衣機</h2><span class="soon" id="soon-w"></span></div>
<div class="grid" id="washers"></div>
<div class="head"><h2>烘衣機</h2><span class="soon" id="soon-d"></span></div>
<div class="grid" id="dryers"></div>

<div id="ask"><div class="box">
  <h3 id="ask-title">提醒我</h3>
  <p id="ask-text">洗好前幾分鐘先通知你一次？完成時會再通知一次。</p>
  <input type="number" id="ask-min" min="0" max="120" step="1" inputmode="numeric">
  <div class="btns"><button id="ask-no">取消</button><button class="go" id="ask-ok">設定</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
const MACHINES = [
  ["94c96001b3d9","洗 1","w"], ["94c96001b3ef","洗 2","w"], ["94c96001b3ee","洗 3","w"],
  ["94c96001b3ff","洗 4","w"], ["94c96001b3d8","洗 5","w"], ["94c96001b3dc","洗 6","w"],
  ["94c96001b3af","烘 1","d"], ["94c96001b399","烘 2","d"],
  ["94c96001b398","烘 3","d"], ["94c96001b3aa","烘 4","d"],
];
const NAME = Object.fromEntries(MACHINES.map(([m, l]) => [m, l]));

// 主狀態碼 → 顯示文字與外觀，取自廠商頁面的狀態表
const STATUS = {
  "-1":["失聯","dead"], 0:["閒置","free"], 1:["閒置","free"], 2:["等待付款","done"],
  4:["等待操作","done"], 5:["等待操作","done"], 8:["運轉中","busy"], 9:["鎖門中","busy"],
  10:["開鎖中","busy"], 11:["暫停","busy"], 12:["剛洗好","done"], 128:["錯誤","err"],
};
const isFinished = (code) => code === 12 || code === 0 || code === 1;

const state = {};   // mac -> {main, timeLeft, ts}
const els = {};
// 盯著的機台：mac -> {lead:提前分鐘, warned:是否已發過提前通知}
let watches = load("watches", {});
let lastLead = load("lastLead", 5);
// 剛開頁面的前幾秒收到的是 retained 舊狀態；此時的「已完成」屬於漏接，通知要註明
let booting = true;

function load(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v === null || v === undefined ? fallback : v;
  } catch { return fallback; }
}
function save() {
  try {
    localStorage.setItem("watches", JSON.stringify(watches));
    localStorage.setItem("lastLead", JSON.stringify(lastLead));
  } catch {}
}

let swReg = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then((r) => { swReg = r; }).catch(() => {});
}

// Android Chrome 禁止 new Notification()（丟 Illegal constructor），必須走 Service Worker 的
// showNotification()；桌面兩種都行。失敗時回傳原因而不是靜默吞掉，才有辦法診斷。
async function notify(body) {
  if (!("Notification" in window)) return "這個瀏覽器不支援通知";
  if (Notification.permission !== "granted") return "沒有通知權限（目前是 " + Notification.permission + "）";
  const opts = { body, icon: "icon-180.png", badge: "icon-180.png", tag: body, renotify: true };
  try {
    const reg = swReg || ("serviceWorker" in navigator ? await navigator.serviceWorker.ready : null);
    if (reg) { await reg.showNotification("碩齋洗衣房", opts); return null; }
  } catch (e) { /* 退回建構式 */ }
  try { new Notification("碩齋洗衣房", opts); return null; }
  catch (e) { return "發送失敗：" + e.name + " " + e.message; }
}

const BELL_SVG =
  '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>' +
  '<path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>';

for (const [mac, label, kind] of MACHINES) {
  const el = document.createElement("div");
  el.className = "m dead";
  el.innerHTML =
    '<div class="top"><span class="n">' + label + '</span>' +
    '<button class="bell" title="完成前提醒我" aria-label="提醒我">' + BELL_SVG + '</button></div>' +
    '<span class="s">—</span><span class="t"></span><span class="lead"></span>';
  document.getElementById(kind === "w" ? "washers" : "dryers").append(el);
  el.querySelector(".bell").addEventListener("click", () => toggleBell(mac));
  els[mac] = el;
}

// 心跳是 16-bit 混合碼，高位元組才是主狀態；watchdog 的 -1 不做位移
const mainCode = (c) => (c < 0 ? c : (c >> 8) & 0xff);
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

// 機器的 timeLeft 以 4 秒為單位跳動，而心跳每 3 秒一次，所以每 12 秒會出現一則
// 「數字沒變」的心跳。換算成完成時刻後位移呈 -1,-1,-1,+3 的鋸齒（實測平均 1.5 秒、
// 最大 3 秒，不會累積漂移）。若讓外推值去追每一則心跳，畫面就會忽快忽停。
// 作法：鎖定「預計完成時刻」，只有位移超過容差（暫停、換輪、真正的修正）才重新對時；
// 平常一律用鎖定的時刻減現在，畫面就每秒穩定走一格。
const ENDS_TOLERANCE = 10;
const anchor = {};   // mac -> {main, endsAt}

function displayRemaining(mac, s) {
  if (s.main !== 8) { delete anchor[mac]; return s.timeLeft || 0; }
  const ends = s.ts + (s.timeLeft || 0);
  const a = anchor[mac];
  if (!a || a.main !== s.main || Math.abs(ends - a.endsAt) > ENDS_TOLERANCE) {
    anchor[mac] = { main: s.main, endsAt: ends };
  }
  return Math.max(0, Math.floor(anchor[mac].endsAt - Date.now() / 1000));
}

// --- 鈴鐺 ---
let asking = null;
const ask = document.getElementById("ask");
const askMin = document.getElementById("ask-min");

async function toggleBell(mac) {
  if (watches[mac]) { delete watches[mac]; save(); render(); return; }
  if (!("Notification" in window)) { blocked("這個瀏覽器不支援通知。"); return; }
  if (Notification.permission === "default") await Notification.requestPermission();
  if (Notification.permission !== "granted") {
    blocked("瀏覽器的通知權限被關掉了，要到網站設定裡重新開啟才能提醒你。");
    return;
  }
  asking = mac;
  document.getElementById("ask-title").textContent = NAME[mac] + " 提醒我";
  askMin.value = lastLead;
  ask.classList.add("show");
  askMin.focus();
  askMin.select();
}
function closeAsk() { ask.classList.remove("show"); asking = null; }
function confirmAsk() {
  if (!asking) return;
  const n = Math.max(0, Math.min(120, Math.round(Number(askMin.value) || 0)));
  lastLead = n;
  watches[asking] = { lead: n, warned: false };
  save(); closeAsk(); render();
}
function blocked(msg) {
  asking = null;
  document.getElementById("ask-title").textContent = "沒辦法設定提醒";
  document.getElementById("ask-text").textContent = msg;
  askMin.style.display = "none";
  document.getElementById("ask-ok").style.display = "none";
  document.getElementById("ask-no").textContent = "知道了";
  ask.classList.add("show");
}
document.getElementById("ask-no").addEventListener("click", closeAsk);
document.getElementById("ask-ok").addEventListener("click", confirmAsk);
ask.addEventListener("click", (e) => { if (e.target === ask) closeAsk(); });
askMin.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmAsk(); });

function render() {
  const tally = { w: { free: 0, done: 0, soon: null }, d: { free: 0, done: 0, soon: null } };

  for (const [mac, label, kind] of MACHINES) {
    const s = state[mac], el = els[mac];
    if (!s) continue;
    // 完成與否一律以機器回報的主狀態為準。過去這裡用「外推歸零就當作完成」，
    // 結果機器持續回報 timeLeft=1 時，狀態會每秒在運轉中／剛洗好之間跳，還會發出假通知。
    const code = s.main;
    const left = displayRemaining(mac, s);
    const st = STATUS[code] || ["未知", "dead"];
    const t = tally[kind];

    if (code === 0 || code === 1) t.free++;
    else if (code === 12) t.done++;
    else if (code === 8 && (t.soon === null || left < t.soon)) t.soon = left;

    // 盯著的機台：提前一次、完成一次，完成後自動取消
    const w = watches[mac];
    if (w) {
      if (isFinished(code)) {
        notify(booting ? label + " 洗好了（你不在時完成）" : label + " 洗好了");
        delete watches[mac]; save();
      } else if (code === 8 && !w.warned && left <= w.lead * 60) {
        if (w.lead > 0) notify(label + " 還有 " + Math.ceil(left / 60) + " 分鐘洗好");
        w.warned = true; save();
      }
    }

    el.className = "m " + st[1];
    el.querySelector(".s").textContent = st[0];
    el.querySelector(".t").textContent =
      code === 8 ? (left > 0 ? "剩 " + mmss(left) : "即將完成") : "";
    el.querySelector(".bell").classList.toggle("on", !!watches[mac]);
    el.querySelector(".lead").textContent =
      watches[mac] && watches[mac].lead > 0 ? "提前 " + watches[mac].lead + " 分" : "";
  }

  const free = tally.w.free + tally.d.free;
  const done = tally.w.done + tally.d.done;
  document.getElementById("summary").innerHTML =
    "<b>" + free + "</b> 台閒置" +
    (done ? '<span class="sep">·</span><b class="warm">' + done + "</b> 台剛洗好" : "");
  document.getElementById("keepopen").classList
    .toggle("show", Object.keys(watches).length > 0);

  // 各區塊：有閒置就報台數，否則報最快多久有一台
  for (const pair of [["w", "soon-w"], ["d", "soon-d"]]) {
    const t = tally[pair[0]], el = document.getElementById(pair[1]);
    if (t.free > 0) { el.textContent = t.free + " 台可用"; el.className = "soon ok"; }
    else if (t.soon !== null) { el.textContent = "最快 " + mmss(t.soon) + " 後"; el.className = "soon"; }
    else { el.textContent = ""; el.className = "soon"; }
  }
}

const conn = document.getElementById("conn");
const client = mqtt.connect("wss://wipepay.com.tw:443/mqtt/");

client.on("connect", () => {
  conn.textContent = "已連線";
  conn.className = "";
  for (const m of MACHINES) client.subscribe("machine/" + m[0] + "/status/#");
  // retained 訊息應立即到達；沒到的當作失聯
  setTimeout(() => {
    for (const m of MACHINES) if (!state[m[0]]) state[m[0]] = { main: -1, timeLeft: 0, ts: 0 };
    render();
    booting = false;
  }, 5000);
});
client.on("reconnect", () => { conn.textContent = "重新連線中…"; conn.className = "bad"; });
client.on("close", () => { conn.textContent = "已斷線"; conn.className = "bad"; });

client.on("message", (topic, payload) => {
  const mac = topic.split("/")[1];
  let d; try { d = JSON.parse(payload.toString()); } catch { return; }
  if (d.type !== "status" || !els[mac]) return;
  const prev = state[mac];
  if (prev && d.ts < prev.ts) return;               // 忽略較舊的亂序訊息
  state[mac] = { main: mainCode(d.status), timeLeft: d.timeLeft || 0, ts: d.ts };
  render();
});

// 測試按鈕：把「邏輯有沒有跑」和「系統有沒有顯示」分開，失敗時直接把原因寫在畫面上
document.getElementById("test").addEventListener("click", async () => {
  const msg = document.getElementById("testmsg");
  msg.className = ""; msg.textContent = "送出中…";
  if ("Notification" in window && Notification.permission === "default") {
    await Notification.requestPermission();
  }
  const err = await notify("測試通知：看得到這則就表示通知正常");
  if (err) { msg.className = "bad"; msg.textContent = "✕ " + err; }
  else { msg.className = "ok"; msg.textContent = "✓ 已送出。沒跳出來就是被系統擋掉了（Windows 專注輔助、或 Chrome 的網站通知設定）"; }
});

// 每 250 毫秒重畫一次。倒數本身是「鎖定的完成時刻減現在」，秒數的整數邊界落在哪個
// 瞬間由完成時刻的小數決定，跟畫面的節拍沒有鎖相；若一秒只畫一次，兩個約 1Hz 的
// 過程會互相飄移，看起來就是偶爾停一拍、偶爾掉兩秒。畫得比邊界密就不會有這種混疊。
setInterval(render, 250);
render();
</script>
</body>
</html>
